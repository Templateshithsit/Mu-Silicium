name: Build UEFI for active devices
on:
  push:
    branches: ["main"]
    paths:
      - 'Binaries'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'MuPatches/**'
      - 'Platforms/**'
      - 'Silicon/**'
      - 'Silicium-ACPI'
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        required: true
        default: false
  pull_request:
    types: [opened, reopened]
    paths:
      - 'Binaries'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'MuPatches/**'
      - 'Platforms/**'
      - 'Silicon/**'
      - 'Silicium-ACPI'
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build UEFI for active devices
        run: bash ./setup_env.sh -p apt && bash ./build_active_devices.sh

      - name: Upload UEFI images
        uses: actions/upload-artifact@v4
        with:
          name: uefi-images
          path: Build/pipaPkg/*_CLANGPDB/FV/*.fd
          compression-level: 9

      - name: Release UEFI images
        uses: softprops/action-gh-release@v3
        if: inputs.release && github.ref_type == 'tag'
        with:
          files: |
            ./Mu-*
